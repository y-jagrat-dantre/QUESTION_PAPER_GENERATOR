<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASAP - Class 12 Subjects</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(33, 150, 243, 0.2);
      text-align: center;
      width: 90%;
      max-width: 600px;
    }

    h1 {
      color: #1565c0;
      margin-bottom: 30px;
    }

    .subjects {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .subject {
      background: #e3f2fd;
      color: #0d47a1;
      font-weight: bold;
      padding: 20px 30px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s ease;
      width: 150px;
      text-align: center;
      box-shadow: 0 6px 12px rgba(33, 150, 243, 0.1);
    }

    .subject:hover {
      background: #bbdefb;
      transform: translateY(-5px);
    }

    .back {
      margin-top: 25px;
      display: inline-block;
      text-decoration: none;
      color: #1e88e5;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Class 12 Subjects</h1>
    <div class="subjects">
        <div class="subject" onclick="location.href='subjects/class12-physics.html'">Physics</div>
        <div class="subject" onclick="location.href='subjects/class12-chemistry.html'">Chemistry</div>
        <div class="subject" onclick="location.href='subjects/class12-maths.html'">Maths</div>
    </div>
    <a class="back" href="index.html">← Back to Home</a>
  </div>
</body>
</html>
